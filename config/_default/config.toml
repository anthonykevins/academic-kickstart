# Configuration of Academic
# Documentation: https://sourcethemes.com/academic/
#
# This file is formatted using TOML syntax - learn more at https://learnxinyminutes.com/docs/toml/
# Each configuration section is defined by a name in square brackets (e.g. `[outputs]`).

# Name of Academic theme folder in `themes/`.
theme = "academic"

# Title of your site
title = "Anthony Kevins | Political Scientist"

# The URL of your site.
# End your URL with a `/` trailing slash, e.g. `https://example.com/`.
baseurl = "https://anthonykevins.github.io/"

# Enter a copyright notice to display in the site footer.
# To display a copyright symbol, type `&copy;`. For current year, type `{year}`.
copyright = "&copy; Anthony Kevins, {year}"

# Enable analytics by entering your Google Analytics tracking ID
# googleAnalytics = "UA-113520276-1" [now handled in the footer with a lighter weight privacy pack]

# Enable comments by entering your Disqus shortname
disqusShortname = ""

############################
## Advanced options below ##
############################

# IMPORTANT: in TOML a bare key belongs to the most recently opened [table].
# Everything from here down to the first [header] is site-wide config, so it
# must stay ABOVE that header. This block previously sat *after*
# [services.disqus], which meant Hugo silently discarded all of it --
# `hugo config` reported the default timeout of 30s rather than the value set
# here, and enableRobotsTXT / disableAliases / enableGitInfo / ignoreFiles
# never took effect at all. (The site's robots.txt comes from
# static/robots.txt, which is why nothing appeared to be broken.)

enableRobotsTXT = true
disableAliases = true
timeout = "600s"
enableEmoji = true
ignoreFiles = ["\\.ipynb$", ".ipynb_checkpoints$", "\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]

# Get last modified date for content from Git?
enableGitInfo = false

# Default language to use (if you setup multilingual support)
defaultContentLanguage = "en"
hasCJKLanguage = false  # Set `true` for Chinese/Japanese/Korean languages.
defaultContentLanguageInSubdir = false

############################
## Tables below           ##
############################

[params]
  privacy_pack = false

# Number of items per page in paginated lists.
# (Hugo 0.128 renamed the old top-level `paginate` key to pagination.pagerSize.)
[pagination]
  pagerSize = 10

[services]
  [services.disqus]
    shortname = ""

# Multilanguage setup
[languages]
  [languages.en]
    title = "Anthony Kevins"
    weight = 1
  [languages.fr]
    title = "Anthony Kevins"
    weight = 2
    [languages.fr.params]
      footnotereturnlinkcontents = "<sup>^</sup>"

[outputs]
  home = [ "HTML", "CSS", "RSS", "JSON" ]
  section = [ "HTML", "RSS" ]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
      
# Configure BlackFriday Markdown rendering.
#   See: https://gohugo.io/getting-started/configuration/#configure-blackfriday

[imaging]
  resampleFilter = "lanczos"
  quality = 90
  anchor = "smart"  # Anchor for cropping. Options include Smart and Center.

# Taxonomies.
#
# `tag` and `category` were removed: no content in this site sets either, so
# Hugo generated empty /tags/ and /categories/ pages carrying nothing but a
# heading -- and listed both in the sitemap for Google to crawl. Add a line
# back here if you ever start tagging content.
[taxonomies]
  publication_type = "publication_types"
  author = "authors"

# Site map.
[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[minify]
  [minify.tdewolff]
    [minify.tdewolff.css]
