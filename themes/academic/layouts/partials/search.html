<aside class="search-results" id="search">
  <div class="container">
    <section class="search-header">

      <div class="row no-gutters justify-content-between mb-3">
        <div class="col-6">
          <h1>{{ i18n "search" }}</h1>
        </div>
        <div class="col-6 col-search-close">
          <a class="js-search" href="#"><i class="fas fa-times-circle text-muted" aria-hidden="true"></i></a>
        </div>
      </div>

      <div id="search-box">
        {{ if eq $.Site.Params.search.engine 1 }}
        <input name="q" id="search-query" placeholder="{{i18n "search_placeholder"}}" autocapitalize="off"
        autocomplete="off" autocorrect="off" role="textbox" spellcheck="false" type="search">
        {{ else }}
        <!-- Search box will appear here -->
        {{ end }}
      </div>

    </section>
    <section class="section-search-results">

      <div id="search-hits">
        <!-- Search results will appear here -->
      </div>

    </section>
  </div>
</aside>

{{ if eq $.Site.Params.search.engine 1 }}
<script type="text/template" id="search-hit-fuse-template">
  <div class="search-hit" id="hit-{{"{{"}}key{{"}}"}}">
    <div class="search-hit-content">
      <div class="search-hit-name-wrapper">
        <a href="{{"{{"}}relpermalink{{"}}"}}" class="search-hit-name">
          <div>{{"{{"}}title{{"}}"}}</div>
        </a>
        <span class="search-hit-type">{{"{{"}}type{{"}}"}}</span>
        <span class="search-hit-date">{{"{{"}}date{{"}}"}}</span>
        <p id="summary-{{"{{"}}key{{"}}"}}" class="search-hit-description">{{"{{"}}snippet{{"}}"}}</p>
      </div>
    </div>
  </div>
</script>
{{ end }}
